name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bump to throw away the cached third-party builds (libdatachannel, opus, gtest)
  DEPS_CACHE_VERSION: v1

jobs:
  server:
    name: Server (build + unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev pkg-config

      - name: Cache third-party builds
        uses: actions/cache@v4
        with:
          path: server/build/_deps
          key: server-deps-${{ env.DEPS_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('server/cmake/FetchDependencies.cmake') }}

      # WebTransport is OFF here: that configuration only builds inside the
      # Docker image (see the "images" job), and the tests do not need it.
      - name: Configure
        run: cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build server/build --target tutti-server tutti-tests

      - name: Unit tests
        run: ctest --test-dir server/build --output-on-failure --timeout 120

  server-sanitizers:
    name: Server (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev pkg-config

      - name: Cache third-party builds
        uses: actions/cache@v4
        with:
          path: server/build-san/_deps
          key: server-deps-san-${{ env.DEPS_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('server/cmake/FetchDependencies.cmake') }}

      - name: Configure
        run: >
          cmake -S server -B server/build-san -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DTUTTI_SANITIZE=address,undefined

      - name: Build
        run: cmake --build server/build-san --target tutti-tests

      - name: Unit tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir server/build-san --output-on-failure --timeout 300

  client:
    name: Client (check + unit tests + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build

  e2e:
    name: End-to-end (Chromium, Firefox, WebKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev pkg-config

      - name: Cache third-party builds
        uses: actions/cache@v4
        with:
          path: server/build/_deps
          key: server-deps-${{ env.DEPS_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('server/cmake/FetchDependencies.cmake') }}

      - name: Build server
        run: |
          cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTUTTI_BUILD_TESTS=OFF
          cmake --build server/build --target tutti-server

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install browsers
        working-directory: client
        run: npx playwright install --with-deps chromium firefox webkit

      # The native server has WebTransport off, so every engine uses WebRTC
      # here. WebTransport is covered in the "images" job.
      - name: Run end-to-end tests
        working-directory: client
        env:
          TUTTI_SERVER_BIN: ${{ github.workspace }}/server/build/tutti-server
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

  images:
    name: Container images (+ WebTransport end-to-end)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # This is the only place the WebTransport-enabled server is compiled.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: tutti-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          tags: tutti-client:ci
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Start server container
        run: |
          docker run -d --name tutti-server --network host tutti-server:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 1
          done
          docker logs tutti-server
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies and browsers
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Run WebTransport end-to-end tests
        working-directory: client
        env:
          TUTTI_E2E_BACKEND: "1"
          TUTTI_E2E_WEBTRANSPORT: "1"
        run: npx playwright test --project=chromium --project=firefox e2e/game-transport.spec.ts

      - name: Server logs
        if: ${{ failure() }}
        run: docker logs tutti-server | tail -200

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webtransport
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
